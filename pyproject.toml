[project]
name = "stress-aware-portfolio-optimization"
version = "0.1.0"
description = "Walk-forward comparison of volatility forecasts and risk-based portfolio allocation"
requires-python = ">=3.11"
dependencies = [
  "pandas", "numpy", "scipy", "scikit-learn", "arch", "statsmodels", "matplotlib",
  "pyarrow", "PyYAML", "requests", "xgboost",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbconvert", "ipykernel"]
app = ["streamlit", "plotly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
